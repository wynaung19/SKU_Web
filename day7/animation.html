<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      @keyframes bomb {
        from {
          font-size: 100%;
        }
        to {
          font-size: 600%;
        }
      }
      /* h3 {
        animation-name: bomb;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-delay: 4s;
      } */
      span {
        transition: font-size 1s;
      }
      span:hover {
        font-size: 500%;
      }
    </style>
  </head>
  <body>
    <!-- <h3>꽝!</h3> -->
    <span>꽝!</span>
  </body>
</html>
