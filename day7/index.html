<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        border-collapse: collapse;
      }
      td,
      th {
        text-align-last: left;
        padding: 10px;
        height: 20px;
        width: 100px;
      }
      thead {
        background-color: darkblue;
        color: cyan;
      }
      td,
      tfoot th {
        border-bottom: 1px solid gray;
      }
    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>HTML</th>
          <th>CSS</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>WaiYanNaung</td>
          <td>90</td>
          <td>80</td>
        </tr>
        <tr>
          <td>AungAung</td>
          <td>85</td>
          <td>95</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th>Total</th>
          <th>175</th>
          <th>175</th>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
