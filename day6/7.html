<!DOCTYPE html>
<html>
  <head>
    <title>Shadow</title>
    <style>
      div {
        font-size: 40px;
      }
      .red {
        text-shadow: 3px 3px red;
      }
      .blur {
        text-shadow: 3px 3px 8px #555;
      }
      .glow {
        text-shadow: 0 0 5px blue;
      }
      .threeD {
        color: white;
        text-shadow: 2px 2px 4px black;
      }
      .wordArt {
        color: white;
        text-shadow: 0px 0px 3px darkBlue;
      }
      .multi {
        color: rgb(106, 253, 255);
        text-shadow: 2px 2px 2px black, 0 0 25px blue, 0 0 5px darkblue;
      }
    </style>
  </head>
  <body>
    <div class="red">Lorem ipsum dolor sit.</div>
    <div class="blur">Lorem ipsum dolor sit.</div>
    <div class="glow">Lorem ipsum dolor sit.</div>
    <div class="threeD">Lorem ipsum dolor sit.</div>
    <div class="wordArt">Lorem ipsum dolor sit.</div>
    <div class="multi">Lorem ipsum dolor sit.</div>
  </body>
</html>
