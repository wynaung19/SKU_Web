<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        border: 2px solid yellowgreen;
        color: blue;
        background: aliceblue;
      }
      p {
        padding: 0 10px;
      }
      span {
        border: 3px dotted red;
        background: yellow;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div>
      <p>NONE : <span style="display: none">TEXT HERE</span></p>
    </div>
    <hr />
    <div>
      <p>Inline : <span style="display: inline">INLINE</span></p>
    </div>
    <hr />
    <div>
      <p>Block : <span style="display: block">BLOCK</span></p>
    </div>
    <hr />
    <div>
      <p>
        Inline-Block :
        <span
          style="display: inline-block; width: 200px; background: lightgreen"
          >INLINE-BLOCK</span
        >
      </p>
    </div>
  </body>
</html>
